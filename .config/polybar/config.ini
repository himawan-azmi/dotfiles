[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 16pt
radius = 6

font-0 = "sans-serif:size=10;2"
font-1 = "Font Awesome 7 Free:size=11;2"
font-2 = "Font Awesome 7 Free Solid:size=11;2"
font-3 = "Font Awesome 7 Brands:size=11;2"
font-4 = "JetBrainsMono Nerd Font:size=10;2"

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 3pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

modules-left = xworkspaces xwindow
modules-right = filesystem memory cpu battery network pulseaudio date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

format-muted = <label-muted>
; \uf6a9 adalah kode hex untuk ikon volume disilang (muted)
format-muted-prefix = " "
label-muted = Muted
label-muted-foreground = #676e7d

; Menggunakan kode hex \uf026 (lemah), \uf027 (sedang), \uf028 (keras)
ramp-volume-0 = " "
ramp-volume-1 = " "
ramp-volume-2 = " "
ramp-volume-0-foreground = #8fbcbb
ramp-volume-1-foreground = #a3be8c
ramp-volume-2-foreground = #ebcb8b

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
low-at = 10

; Format tampilan saat mengisi daya (Charging)
; Menampilkan animasi petir/cas + teks persentase
format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%

; Format tampilan saat baterai berkurang (Discharging)
; Menampilkan ikon baterai dinamis sesuai kapasitas + teks persentase
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

; Format tampilan saat baterai penuh (\uf240 adalah ikon baterai penuh)
format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = #a3be8c
label-full = %percentage%%

; Daftar ikon berdasarkan kapasitas baterai dari kosong ke penuh
; \uf244 (kosong), \uf243 (seperempat), \uf242 (setengah), \uf241 (tiga perempat), \uf240 (penuh)
ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "
; Warna merah saat kritis
ramp-capacity-0-foreground = #bf616a 
; Warna oranye saat rendah
ramp-capacity-1-foreground = #d08770 

; Animasi ikon saat baterai sedang dicas
animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "
animation-charging-framerate = 750
; Warna kuning saat ngecas
animation-charging-foreground = #ebcb8b

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/network]
type = internal/network
interface = wlp0s20f3
# Diubah ke 1.0 atau 2.0 detik agar pembaruan kecepatan internet lebih real-time
interval = 1.0

# Menambahkan elemen <label-connected> yang nantinya berisi info Wi-Fi dan Kecepatan
format-connected = <ramp-signal> <label-connected>

# MODIFIKASI DISINI: 
# Menampilkan Nama Wi-Fi (%essid%) diikuti pembatas, lalu ikon Download (📥/) dan Upload (📤/) beserta kecepatannya
# %downspeed:7% memberikan ruang spasi tetap agar teks tidak bergeser kasar saat angka berubah
label-connected = "%essid%  │   %downspeed:7%  │   %upspeed:7%"
label-connected-foreground = #cdd6f4

format-disconnected = <label-disconnected>
# \uf1eb disilang / tidak aktif
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = #bf616a
label-disconnected = Putus
label-disconnected-foreground = #676e7d

; \uf1eb adalah kode hex untuk ikon sinyal Wifi broadcast
ramp-signal-0 = " "
ramp-signal-1 = " "
ramp-signal-2 = " "
ramp-signal-3 = " "
ramp-signal-0-foreground = #bf616a
ramp-signal-3-foreground = #a3be8c

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
